# nginx: принимает запросы на 80/443 и передаёт их Go-серверу на 127.0.0.1:8080.
# Устанавливается в /etc/nginx/sites-available/ar-web-studio. HTTPS добавляет certbot.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name arwebstudio.shop www.arwebstudio.shop _;

    client_max_body_size 1m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;

    # Статику nginx отдаёт сам и разрешает браузеру кэшировать её на неделю
    location /static/ {
        alias /opt/ar-web-studio/static/;
        expires 7d;
        access_log off;
    }

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
